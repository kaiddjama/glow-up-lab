name: Amazon.ae makeup products (create / publish)
# create: adds the products of stock-sync/amz/selection.json as hidden drafts tagged epuise-auto (nothing goes online).
# publish: puts on the Online Store channel the selection products that the targeted check made ACTIVE.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "create or publish"
        type: choice
        options: [create, publish]
        default: create
      dry_run:
        description: "List only, change nothing on Shopify"
        type: boolean
        default: true
      only_handles:
        description: "create mode: comma-separated handles (empty = whole selection)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: amz-create
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      PRICE_FORMULA: ${{ secrets.PRICE_FORMULA || format('{0},{1},{2}', vars.PRICE_MULT, vars.SHIPPING_AED_PER_KG, vars.AED_TO_FDJ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: ${{ inputs.mode }} products
        working-directory: stock-sync
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_HANDLES: ${{ inputs.only_handles }}
        run: python3 -I amz_create.py ${{ inputs.mode == 'publish' && 'publish' || '' }}
