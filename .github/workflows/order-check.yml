name: Order availability check
# Every 10 minutes: new orders get their items checked on Amazon.ae. An item that cannot be bought there goes to Épuisé,
# the order is tagged amazon-ko and an alert is posted as a comment on pull request #15 (the alerts mailbox).
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"  # not on :00 (GitHub drops the busiest minutes most)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and report only, change nothing on Shopify, post nothing"
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: write
  issues: write   # the alert of last resort
  actions: write  # checks that the clock (heartbeat.yml) is alive
concurrency:
  group: order-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      PRICE_FORMULA: ${{ secrets.PRICE_FORMULA || format('{0},{1},{2}', vars.PRICE_MULT, vars.SHIPPING_AED_PER_KG, vars.AED_TO_FDJ) }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Orders to check
        id: orders
        working-directory: stock-sync
        run: python3 -I order_check.py list
      - name: Install the browser
        if: steps.orders.outputs.count != '0'
        timeout-minutes: 25
        run: .github/install-browser.sh
      - name: Check the items on Amazon.ae
        if: steps.orders.outputs.count != '0'
        working-directory: stock-sync
        env:
          FETCHER: browser
        run: python3 -I order_check.py check
      - name: Post the alert
        if: ${{ !cancelled() && hashFiles('stock-sync/alert.md') != '' && env.DRY_RUN != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment 15 --body-file stock-sync/alert.md || \
            .github/alert.sh "Alerte commande : article à regarder" "$(cat stock-sync/alert.md)"
      - name: Keep the clock alive
        if: ${{ !cancelled() && github.ref_name == 'main' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I stock-sync/heartbeat.py ensure
      - name: Alert when the check itself failed
        if: ${{ failure() && env.DRY_RUN != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/alert.sh "Alerte inventaire : contrôle des commandes en échec" "Le contrôle des commandes de $(TZ=Africa/Djibouti date '+%d/%m %Hh%M') (heure de Djibouti) a échoué : les nouvelles commandes ne sont peut-être pas vérifiées chez le fournisseur. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
