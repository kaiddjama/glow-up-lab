name: Amazon.ae variations probe
# Reads the variations (flavours) of listings on Amazon.ae with a real headless browser set to Dubai / Ras Al Khor.
# No secrets, nothing is changed on Shopify.
on:
  workflow_dispatch:
    inputs:
      asins:
        description: "Seed ASINs, separated by spaces"
        type: string
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Read pages
        working-directory: stock-sync
        env:
          DELAY: "8"
          ASINS: ${{ inputs.asins }}
        run: python3 probe_variants.py $ASINS
