name: Inventory audit (branch test)
# Reads EVERY product and checks what the stock sync must guarantee (stock tracking on, Épuisé really not orderable,
# every active product read recently, ASIN, published, price). Switches stock tracking on when it is off.
# Runs after each full stock check, and on demand. dry_run=true only reports.
on:
  push:
    branches: ["claude/project-thread-woee5h"]
    paths: [".github/workflows/audit-test.yml"]
permissions:
  contents: read
concurrency:
  group: inventory-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the whole catalogue
        working-directory: stock-sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: '1'
        run: python3 -I inventory_audit.py
# retry
