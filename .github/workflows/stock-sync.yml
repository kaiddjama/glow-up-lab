name: Amazon.ae stock and price sync
# Reads product pages and updates price and stock. All settings are repository secrets.
# Runs every night at about 03:00 Djibouti time (00:07 UTC; not exactly :00, GitHub skips runs scheduled on the hour when busy). Run it by hand with "Run workflow": dry_run=true reads and reports only.
on:
  schedule:
    - cron: "7 0 * * *"  # 00:07 UTC = 03:07 Djibouti, every night
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and report only, change nothing on Shopify"
        type: boolean
        default: true
      prices_only:
        description: "Update prices only: no stock, set-aside or delivery-label change"
        type: boolean
        default: false
      limit:
        description: "Only read the first N Amazon pages (empty = all)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: stock-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        timeout-minutes: 8
        run: pip install playwright && playwright install --with-deps chromium
      - name: Sync shard ${{ matrix.shard }}
        working-directory: stock-sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHARD: ${{ matrix.shard }}
          PRICE_FORMULA: ${{ secrets.PRICE_FORMULA || format('{0},{1},{2}', vars.PRICE_MULT, vars.SHIPPING_AED_PER_KG, vars.AED_TO_FDJ) }}  # the secret wins if set; else the repository variables
          FETCHER: browser
          PRICES_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.prices_only && '1' || '0' }}
          SELLER_RULE: "0"
          DELAY: "8"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
        run: python3 -I amazon_sync.py results
