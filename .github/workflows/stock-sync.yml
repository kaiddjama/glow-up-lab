name: Amazon.ae stock and price sync
# Reads product pages and updates price and stock. All settings are repository secrets.
# Three full checks a day (about 40 min each on 16 runners), each done before the usual ordering peaks (Djibouti is UTC+3):
# 03:07 (done ~04:00, before the morning), 10:07 (done ~11:00, before the afternoon), 16:07 (done ~17:00, before the evening).
# Not exactly on the hour: GitHub skips runs scheduled on the hour when busy.
# Run it by hand with "Run workflow": dry_run=true reads and reports only.
on:
  schedule:
    - cron: "7 0 * * *"   # 03:07 Djibouti
    - cron: "7 7 * * *"   # 10:07 Djibouti
    - cron: "7 13 * * *"  # 16:07 Djibouti
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and report only, change nothing on Shopify"
        type: boolean
        default: true
      prices_only:
        description: "Update prices only: no stock, set-aside or delivery-label change"
        type: boolean
        default: false
      limit:
        description: "Only read the first N Amazon pages (empty = all)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: stock-sync
  cancel-in-progress: false
jobs:
  unmapped:
    # Variants of multi-variant products with no ASIN cannot be read on Amazon.ae: they are set to Épuisé.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stop selling variants without an ASIN
        working-directory: stock-sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python3 -I unmapped_guard.py
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # each runner has its own IP and reads one page every ~10 s; more runners = faster, same pace per IP
        # (GitHub allows 20 jobs at once on a public repository: 16 readers + the guard job)
        shard: ["0/16", "1/16", "2/16", "3/16", "4/16", "5/16", "6/16", "7/16",
                "8/16", "9/16", "10/16", "11/16", "12/16", "13/16", "14/16", "15/16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        timeout-minutes: 8
        run: pip install playwright && playwright install --with-deps chromium
      - name: Sync shard ${{ matrix.shard }}
        working-directory: stock-sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHARD: ${{ matrix.shard }}
          PRICE_FORMULA: ${{ secrets.PRICE_FORMULA || format('{0},{1},{2}', vars.PRICE_MULT, vars.SHIPPING_AED_PER_KG, vars.AED_TO_FDJ) }}  # the secret wins if set; else the repository variables
          FETCHER: browser
          PRICES_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.prices_only && '1' || '0' }}
          SELLER_RULE: "0"
          DELAY: "8"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
        run: python3 -I amazon_sync.py results
  coverage:
    # Safeguard: every variant on sale must have been read on Amazon.ae in the last 6 h. Pages that were not read are
    # read again (two passes); what is still unverified after that is set to Épuisé (the job fails if too many are).
    needs: [unmapped, sync]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.limit != '' || inputs.prices_only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      PRICE_FORMULA: ${{ secrets.PRICE_FORMULA || format('{0},{1},{2}', vars.PRICE_MULT, vars.SHIPPING_AED_PER_KG, vars.AED_TO_FDJ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Variants not verified (pass 1)
        id: p1
        working-directory: stock-sync
        run: python3 -I coverage.py list
      - name: Install the browser
        if: steps.p1.outputs.count != '0'
        timeout-minutes: 8
        run: pip install playwright && playwright install --with-deps chromium
      - name: Read them again (pass 1)
        if: steps.p1.outputs.count != '0'
        working-directory: stock-sync
        env:
          ONLY_ASINS: ${{ steps.p1.outputs.asins }}
          FETCHER: browser
          SELLER_RULE: "0"
          DELAY: "8"
        run: python3 -I amazon_sync.py results
      - name: Variants not verified (pass 2)
        id: p2
        if: steps.p1.outputs.count != '0'
        working-directory: stock-sync
        run: python3 -I coverage.py list
      - name: Read them again (pass 2)
        if: steps.p1.outputs.count != '0' && steps.p2.outputs.count != '0'
        working-directory: stock-sync
        env:
          ONLY_ASINS: ${{ steps.p2.outputs.asins }}
          FETCHER: browser
          SELLER_RULE: "0"
          DELAY: "8"
        run: python3 -I amazon_sync.py results
      - name: Hide what is still not verified
        working-directory: stock-sync
        run: python3 -I coverage.py enforce
