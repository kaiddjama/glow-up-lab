name: Amazon.ae browser probe
# Test only: reads a few Amazon.ae pages with a real headless browser set to Dubai. No secrets, nothing is changed.
on:
  workflow_dispatch:
    inputs:
      asins:
        description: "ASINs to read, separated by spaces"
        type: string
        default: "B0CR9LFM72 B0DHVLFR2V B0CWS5QP8F B0BGMGWP14 B015PL0HG0 B06XH28C1K B0019LVGPC B07NWMVMT1 B0013G6FSG B001GCU6KA"
      variants:
        description: "List the variations of each ASIN and read each one (probe_variants.py); an ASIN may also be q:keywords to run a search"
        type: boolean
        default: false
      district:
        description: "Delivery district in the Deliver-to pop-up (empty = first suggestion)"
        type: string
        default: ""
      facts:
        description: "Also print the raw page markers and keep the pages (artifact probe-pages, 3 days)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .github/install-browser.sh
      - name: Read pages
        working-directory: stock-sync
        env:
          DELAY: "8"
          BROWSER_DISTRICT: ${{ inputs.district }}
          ASINS: ${{ inputs.asins || 'B0CR9LFM72 B0DHVLFR2V B0CWS5QP8F B0BGMGWP14 B015PL0HG0 B06XH28C1K B0019LVGPC B07NWMVMT1 B0013G6FSG B001GCU6KA' }}
          FACTS: ${{ inputs.facts && '1' || '0' }}
          DUMP_DIR: ${{ inputs.facts && 'dump' || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.variants }}" = "true" ]; then python3 probe_variants.py $ASINS; else python3 probe_browser.py $ASINS; fi
      - name: Keep the pages
        if: ${{ always() && inputs.facts }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-pages
          path: stock-sync/dump/
          if-no-files-found: ignore
          retention-days: 3
