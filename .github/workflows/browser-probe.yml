name: Amazon.ae browser probe
# Test only (shade audit of the NYX, e.l.f. and Huda Beauty names): reads Amazon.ae pages with a real headless browser
# set to Dubai, one shard per runner. Reads Shopify, writes nothing anywhere.
on:
  workflow_dispatch:
    inputs:
      asins:
        description: "unused (kept for compatibility)"
        type: string
        default: ""
      district:
        description: "Delivery district in the Deliver-to pop-up (empty = first suggestion)"
        type: string
        default: ""
      facts:
        description: "unused (kept for compatibility)"
        type: boolean
        default: false
      mode:
        description: "audit = shop names vs Amazon.ae pages, discover = search the brands' current catalogue"
        type: string
        default: "audit"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .github/install-browser.sh
      - name: Read pages
        working-directory: stock-sync
        env:
          DELAY: "8"
          BROWSER_DISTRICT: ${{ inputs.district }}
          VENDORS: "vendor:NYX*,vendor:e.l.f.*,vendor:elf*,vendor:Huda*,title:Huda*,title:NYX*,title:e.l.f.*"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.mode }}" = "discover" ]; then python3 -I discover.py ${{ matrix.shard }} 6 out
          else python3 -I shade_audit.py ${{ matrix.shard }} 6 out; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shade-audit-${{ matrix.shard }}
          path: stock-sync/out/
          if-no-files-found: ignore
          retention-days: 3
