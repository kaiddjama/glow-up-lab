name: Probe noon.com
# Manual only: reads a few noon.com (UAE) search and product pages to see whether they can be read from a runner.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Searches, separated by |"
        type: string
        default: "essence 8h matte comfort lip liner|tree hut shea sugar scrub moroccan rose|naturium vitamin c serum 30 ml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: pip install playwright && playwright install --with-deps chromium
      - name: Read noon.com
        working-directory: stock-sync
        env:
          QUERIES: ${{ inputs.queries }}
        run: |
          IFS='|' read -ra Q <<< "$QUERIES"
          python3 -I probe_noon.py "${Q[@]}"
